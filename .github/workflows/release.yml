name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            target: x86_64-linux-gnu
            archive: tar.gz
            binary: coda
          - name: macos-aarch64
            target: aarch64-macos
            archive: tar.gz
            binary: coda
          - name: windows-x86_64
            target: x86_64-windows
            archive: zip
            binary: coda.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Test
        run: zig build test

      - name: Build
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }}

      - name: Package
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME:-manual}"
          asset="coda-${version}-${{ matrix.name }}"
          mkdir -p "dist/${asset}"

          cp "zig-out/bin/${{ matrix.binary }}" "dist/${asset}/"
          cp README.md "dist/${asset}/"

          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist && zip -r "${asset}.zip" "${asset}")
            sha256sum "dist/${asset}.zip" > "dist/${asset}.zip.sha256"
          else
            tar -C dist -czf "dist/${asset}.tar.gz" "${asset}"
            sha256sum "dist/${asset}.tar.gz" > "dist/${asset}.tar.gz.sha256"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: coda-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
